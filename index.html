<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      CampusNav: An Interactive Web-Based School Map and Room Locator System
    </title>
    <link rel="stylesheet" href="style.css" />

    <link rel="icon" type="img" href="icon.png" />
  </head>
  <body>
    <div class="login-container">
      <header class="brand">
        <img
          class="brand-logo"
          src="866130505_2647114759034524_583583260730050804_n.png"
          alt="CampusNav - Gordon College"
        />
        <h1>GORDON COLLEGE</h1>
        <h2>CAMPUS NAVIGATION PORTAL</h2>
        <p>CampusNav</p>
      </header>
      <form action="dashboard.html" method="get">
        <div class="input-group">
          <label for="username">Username*</label>
          <input
            type="text"
            id="username"
            name="username"
            required
            placeholder="Email/ID/Registration Number"
          />
        </div>

        <div class="input-group">
          <label for="password">Password*</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            placeholder="Your password"
          />
        </div>
        <button type="submit">Login</button>
      </form>
      <p class="privacy-notice">
        By clicking the login button, you recognize the authority of Gordon
        College to process your personal and sensitive information, pursuant to
        the
        <span class="privacy-link">Gordon College General Privacy Notice</span>
        and applicable laws.
      </p>
    </div>
  </body>
</html>
